name: CI

on:
  push:
  pull_request:

env:
  RENODE_VERSION: "1.16.1"

jobs:
  core:
    name: Build and core tests (phases 1 to 3)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build firmware
        run: make build
      - name: Core tests
        run: make test-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-core
          path: |
            test-logs/
            build/firmware/**/*.elf
            build/firmware/**/*.map
          if-no-files-found: ignore

  faults:
    name: Fault injection tests (phase 4)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build firmware
        run: make build
      - name: Fault tests
        run: make test-faults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-faults
          path: test-logs/
          if-no-files-found: ignore

  fleet:
    name: Fleet tests (phase 5)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build firmware
        run: make build
      - name: Fleet tests
        run: make test-fleet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-fleet
          path: test-logs/
          if-no-files-found: ignore

  docker:
    name: Reproduce with Dockerfile (core tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ota-lab .
      - name: Core tests inside the image
        run: docker run --rm ota-lab make test-core
